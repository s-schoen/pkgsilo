# Codecov settings for the coverage and test results that the test (PostgreSQL) and ui-test jobs of ci.yml
# upload.
# Validate changes with: curl -X POST --data-binary @.github/codecov.yml https://codecov.io/validate

# Informational: the statuses report coverage but never fail a pull request, so they never hold back
# Renovate's automerge either.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        target: 90%
        informational: true

# Only for a change in coverage, which spares Renovate's pull requests a comment.
comment:
  layout: "condensed_header, diff, components, condensed_files"
  require_changes: true

# The Go coverage profile names files by import path: the module path pkgsilo becomes the repository
# root. The web UI's lcov report names them relative to ui/.
fixes:
  - "pkgsilo/::"
  - "^src/::ui/src/"

# One component per feature slice, so that a pull request shows the coverage of each.
component_management:
  individual_components:
    - component_id: core
      paths:
        - "core/**"
    - component_id: identity
      paths:
        - "feature/identity/**"
    - component_id: group
      paths:
        - "feature/group/**"
    - component_id: health
      paths:
        - "feature/health/**"
    - component_id: apikey
      paths:
        - "feature/apikey/**"
    - component_id: password
      paths:
        - "feature/password/**"
    - component_id: permission
      paths:
        - "feature/permission/**"
    - component_id: policy
      paths:
        - "feature/policy/**"
    - component_id: app
      name: app and cmd
      paths:
        - "app/**"
        - "cmd/**"
    - component_id: test
      name: test helpers
      paths:
        - "test/**"
    - component_id: ui
      name: web UI
      paths:
        - "ui/src/**"
