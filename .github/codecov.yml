# Codecov settings for the coverage and test results that the test (PostgreSQL) job of ci.yml uploads.
# Validate changes with: curl -X POST --data-binary @.github/codecov.yml https://codecov.io/validate

# Informational: the statuses report coverage but never fail a pull request, so they never hold back
# Renovate's automerge either.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# Only for a change in coverage, which spares Renovate's pull requests a comment.
comment:
  layout: "condensed_header, diff, components, condensed_files"
  require_changes: true

# The coverage profile names files by import path: the module path pkgsilo becomes the repository root.
fixes:
  - "pkgsilo/::"

# One component per feature slice, so that a pull request shows the coverage of each.
component_management:
  individual_components:
    - component_id: core
      paths:
        - "core/**"
    - component_id: identity
      paths:
        - "identity/**"
    - component_id: health
      paths:
        - "health/**"
    - component_id: app
      name: app and cmd
      paths:
        - "app/**"
        - "cmd/**"
    - component_id: test
      name: test helpers
      paths:
        - "test/**"
