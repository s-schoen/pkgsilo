name: CI

# Every pushed commit gets the prek hooks, the short tests, the build with the web UI and the web UI's
# tests. Pull requests and master add the tests that need a PostgreSQL container. Both test jobs upload
# their coverage and results to Codecov (.github/codecov.yml). Go comes from the toolchain line in go.mod,
# every other tool from mise.toml.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # A branch of this repository already gets a push run; a pull request from a fork gets none.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          # node, pnpm and task for the web UI's hooks, oxfmt and oxlint; rumdl for the Markdown hook.
          install_args: golangci-lint mockery prek node pnpm task rumdl
      # Verifies the config, then lints with mise's golangci-lint and writes the findings for code scanning.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          install-mode: none
          args: --output.text.path=stdout --output.sarif.path=build/golangci-lint.sarif
      # The rest of the hooks of a local commit. Runs even after lint findings, so that one run reports all
      # problems. The short tests run in their own job.
      - if: ${{ !cancelled() }}
        run: prek run --all-files --show-diff-on-failure --skip golangci-lint --skip golangci-lint-config --skip go-test-short
      # Shows the findings, gosec's among them, in the Security tab and on the lines of a pull request.
      # Under act, the upload would send a local run to GitHub. A pull request from a fork has a token
      # that can't upload.
      - if: ${{ !cancelled() && hashFiles('build/golangci-lint.sarif') != '' && !env.ACT && !github.event.pull_request.head.repo.fork }}
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: build/golangci-lint.sarif
          category: golangci-lint

  test-short:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: task
      - run: task test:short

  # Builds the binary as it's released, with the web UI embedded, which the other jobs leave out.
  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm task
      - run: task build:prod

  # Uploads on every push, so that Codecov has the web UI's coverage of each branch commit and of master.
  ui-test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # The Codecov uploads authenticate with an OIDC token instead of a secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: node pnpm task
      - run: task ui:install
      # Chromium for the stories' tests, cached per version of Playwright. The install then downloads
      # nothing, but adds the system's libraries, which the runner lacks; ui:browsers, a dependency of
      # ui:test, finds Chromium and skips.
      - id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"
        working-directory: ui
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: ui
      - run: task ui:test
      # As in the test (PostgreSQL) job below.
      - if: ${{ !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ui/build/coverage/lcov.info
          disable_search: true
      - if: ${{ !cancelled() && !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          files: ui/build/junit.xml
          disable_search: true

  test:
    name: test (PostgreSQL)
    # Codecov compares a pull request with the coverage of its base commit, so master uploads as well.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The Codecov uploads authenticate with an OIDC token instead of a secret.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          install_args: task gotestsum
      - run: task test
      # Under act, the uploads would send a local run to Codecov. A pull request from a fork gets no OIDC
      # token: the action then uploads without one, which Codecov accepts for a public repository. An
      # upload error doesn't fail the job, so that a Codecov outage doesn't hold back Renovate's automerge.
      - if: ${{ !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: build/coverage
          disable_search: true
      # Runs after failed tests too, so that Codecov reports which tests failed.
      - if: ${{ !cancelled() && !env.ACT }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          report_type: test_results
          use_oidc: true
          files: build/junit.xml
          disable_search: true
