template: testify
dir: "{{.InterfaceDir}}/mocks"
pkgname: mocks
filename: mocks.go
structname: "Mock{{.InterfaceName}}"
packages:
  pkgsilo/core/authn:
    interfaces:
      Authenticator: {}
  pkgsilo/core/authz:
    interfaces:
      Authorizer: {}
      Decider: {}
      OwnerLoader: {}
  pkgsilo/feature/identity/repository:
    interfaces:
      IdentityRepository: {}
  pkgsilo/feature/identity/service:
    interfaces:
      IdentityService: {}
  pkgsilo/feature/group/repository:
    interfaces:
      GroupRepository: {}
  pkgsilo/feature/group/service:
    interfaces:
      GroupService: {}
  pkgsilo/feature/apikey/repository:
    interfaces:
      APIKeyRepository: {}
  pkgsilo/feature/apikey/service:
    interfaces:
      APIKeyService: {}
  pkgsilo/feature/password/repository:
    interfaces:
      PasswordRepository: {}
  pkgsilo/feature/password/service:
    interfaces:
      PasswordService: {}
      # In the package, as a test file: the service's own tests use it, and the mocks package imports the
      # service.
      SessionTerminator:
        config:
          dir: "{{.InterfaceDir}}"
          pkgname: service
          filename: terminator_mock_test.go
      Verifier: {}
  pkgsilo/feature/policy/repository:
    interfaces:
      PolicyRepository: {}
      PolicyWriter: {}
  pkgsilo/feature/policy/service:
    interfaces:
      PolicyService: {}
  pkgsilo/feature/health/repository:
    interfaces:
      HealthRepository: {}
  pkgsilo/feature/health/service:
    interfaces:
      HealthService: {}
  pkgsilo/feature/session/repository:
    interfaces:
      SessionRepository: {}
  pkgsilo/feature/session/service:
    interfaces:
      SessionService: {}
  pkgsilo/feature/permission/service:
    interfaces:
      PermissionService: {}
