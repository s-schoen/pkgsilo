services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pkgsilo
      POSTGRES_PASSWORD: pkgsilo
      POSTGRES_DB: pkgsilo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkgsilo -d pkgsilo"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
