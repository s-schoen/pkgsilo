services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pkgsilo
      POSTGRES_PASSWORD: pkgsilo
      POSTGRES_DB: pkgsilo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pkgsilo -d pkgsilo"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Local trace viewer, started by `task tracing:up`. Receives OTLP/HTTP on 4318 and serves its UI on 16686.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    profiles: ["tracing"]
    ports:
      - "4318:4318"
      - "16686:16686"

volumes:
  postgres-data:
