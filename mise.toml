# Go's version is the toolchain line in go.mod, which actions/setup-go reads in CI as well.
[settings]
idiomatic_version_file_enable_tools = ["go"]

# Exact versions, so that Renovate can update them (.github/renovate.jsonc).
[tools]
golangci-lint = "2.15.0"
gomigrate = "4.20.1"
mockery = "3.9.0"
task = "3.54.0"
# Runs `task test`, to write a JUnit report next to the coverage profile.
gotestsum = "1.13.0"
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
prek = "0.5.10"
cocogitto = "7.0.0"
# Runs the GitHub Actions workflows locally (`task ci:push`, `task ci:pr`).
act = "0.2.94"
