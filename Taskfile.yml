version: '3'

tasks:
  build:
    cmds:
      - go build -o build/pkgsilo ./cmd

  # Embeds the web UI (-tags webui), which `build` leaves out, so that it needs no Node.
  "build:prod":
    deps:
      - ui:build
    env:
      CGO_ENABLED: "0"
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
    cmds:
      - go build -trimpath -tags webui -ldflags "-s -w -X main.version={{.VERSION}}" -o build/pkgsilo ./cmd/

  "ui:install":
    dir: ui
    sources:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
    # Also reinstalls a deleted node_modules.
    generates:
      - node_modules/.modules.yaml
    cmds:
      - pnpm install --frozen-lockfile

  # Compiles the messages into ui/src/paraglide, which git ignores, for the type check of the build and
  # of the lint. The Vite plugin compiles them by itself for the dev server, the build and the tests.
  "ui:i18n":
    dir: ui
    deps:
      - ui:install
    sources:
      - messages/**/*
      - project.inlang/**/*
    generates:
      - src/paraglide/**/*
    cmds:
      - pnpm run i18n

  "ui:dev":
    desc: Run the Vite dev server of the web UI, which proxies /api and /mcp to the server of `task run`
    interactive: true
    dir: ui
    deps:
      - ui:install
    cmds:
      - pnpm run dev

  "ui:build":
    desc: Build the web UI into ui/dist, which `task build:prod` embeds
    dir: ui
    deps:
      - ui:i18n
    sources:
      - src/**/*
      - messages/**/*
      - project.inlang/**/*
      - index.html
      - package.json
      - pnpm-lock.yaml
      - tsconfig.json
      - vite.config.ts
    generates:
      - dist/**/*
    cmds:
      - pnpm run build

  "ui:test":
    desc: Test the web UI, with the coverage in ui/build/coverage and a JUnit report in ui/build/junit.xml
    dir: ui
    deps:
      - ui:install
    cmds:
      - pnpm run test --reporter=default --reporter=junit --outputFile.junit=build/junit.xml {{.CLI_ARGS}}

  "ui:lint":
    desc: Lint the web UI with oxlint, type-aware and with the TypeScript type check
    dir: ui
    deps:
      - ui:i18n
    cmds:
      - pnpm run lint {{.CLI_ARGS}}

  "ui:lint:fix":
    dir: ui
    deps:
      - ui:i18n
    cmds:
      - pnpm run lint:fix {{.CLI_ARGS}}

  "ui:fmt":
    desc: Format the web UI with oxfmt
    dir: ui
    deps:
      - ui:install
    cmds:
      - pnpm run fmt {{.CLI_ARGS}}

  run:
    interactive: true
    dotenv:
      - .env
    deps:
      - build
    cmds:
      - ./build/pkgsilo {{.CLI_ARGS}}

  "db:up":
    cmds:
      - docker compose -f docker-compose.dev.yaml up -d --wait

  # db:down stops only the services without a profile, so Jaeger keeps running. Use tracing:down for it.
  "db:down":
    cmds:
      - docker compose -f docker-compose.dev.yaml down

  "tracing:up":
    desc: Start the Jaeger trace viewer (UI on http://localhost:16686)
    cmds:
      - docker compose -f docker-compose.dev.yaml --profile tracing up -d --wait jaeger
      - echo "Open Jaeger Web UI on http://localhost:16686"

  # Stops only Jaeger; the Postgres service keeps running.
  "tracing:down":
    cmds:
      - docker compose -f docker-compose.dev.yaml --profile tracing stop jaeger

  "db:migrate":
    dotenv:
      - .env
    cmds:
      - migrate -path migrations -database "$DATABASE_URL" up {{.CLI_ARGS}}

  "db:migrate:new":
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "usage: task db:migrate:new -- <name>"
    cmds:
      - migrate create -ext sql -dir migrations {{.CLI_ARGS}}

  generate:
    cmds:
      - mockery

  "openapi:generate":
    desc: Write the OpenAPI document to build/openapi.json without starting the server
    cmds:
      - mkdir -p build
      - go run ./cmd/openapi > build/openapi.json

  "hooks:install":
    cmds:
      - prek install

  "hooks:run":
    cmds:
      - prek run --all-files

  lint:
    cmds:
      - golangci-lint run

  lint:fix:
    cmds:
      - golangci-lint run --fix

  test:
    vars:
      # Every package except the mocks that mockery generates.
      COVERPKG:
        sh: go list ./... | grep -v '/mocks$' | paste -sd, -
    cmds:
      - mkdir -p build
      # gotestsum writes the JUnit report for Codecov's Test Analytics, with go test's own output.
      - gotestsum --format standard-quiet --junitfile build/junit.xml -- -coverpkg={{.COVERPKG}} -coverprofile build/coverage ./...

  "test:short":
    cmds:
      - go test -short ./...

  "coverage:html":
    deps:
      - test
    cmds:
      - go tool cover -html=build/coverage

  vuln:
    cmds:
      - govulncheck ./...

  "ci:push":
    desc: Run the push workflows locally with act
    cmds:
      - task: act
        vars:
          ARGS: push {{.CLI_ARGS}}

  "ci:pr":
    desc: Run the pull request workflows locally with act, for the commits since master
    cmds:
      - mkdir -p build
      # The pull request workflows read the base and head commits, the title and the fork flag from the event.
      - >-
        jq -n
        --arg base "$(git merge-base master HEAD)"
        --arg head "$(git rev-parse HEAD)"
        --arg title "$(git log -1 --format=%s)"
        '{pull_request: {base: {sha: $base}, head: {sha: $head, repo: {fork: false}}, title: $title}}'
        > build/act-pull_request.json
      - task: act
        vars:
          ARGS: pull_request --eventpath build/act-pull_request.json {{.CLI_ARGS}}

  # act runs the workflows on the working tree, uncommitted changes included (see .actrc). The token keeps
  # mise-action below GitHub's rate limit for anonymous requests.
  act:
    internal: true
    vars:
      DOCKER_SOCKET:
        sh: socket="${DOCKER_HOST:-unix:///var/run/docker.sock}"; echo "${socket#unix://}"
    cmds:
      - >-
        GITHUB_TOKEN="${GITHUB_TOKEN:-$(gh auth token)}" act {{.ARGS}}
        --container-daemon-socket -
        --container-options "--volume {{.DOCKER_SOCKET}}:{{.DOCKER_SOCKET}}"
        --env DOCKER_HOST=unix://{{.DOCKER_SOCKET}}
        --env TESTCONTAINERS_HOST_OVERRIDE=localhost

  clean:
    cmds:
      - rm -r build/
